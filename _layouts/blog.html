<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Wenkai Guo</title>
  <meta name="author" content="Wenkai Guo">
  {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
  <link rel="shortcut icon" href="{{ '/image/icon/icon_k.png' | relative_url }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/blogs/blog.css' | relative_url }}">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <main class="post">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-byline">
      <a href="{{ '/' | relative_url }}">Wenkai Guo</a><br>
      Nanyang Technological University{% if page.date_text %}<br>{{ page.date_text }}{% endif %}
    </p>
    <article class="post-body">
      {{ content }}
    </article>
    <p class="post-footer"><a href="{{ '/' | relative_url }}">&larr; Home</a></p>
  </main>
</body>
</html>
